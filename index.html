<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>睡眠・活動ダイアリー</title>
<meta name="theme-color" content="#2f6f6f" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="app-header">
  <h1>睡眠・活動ダイアリー</h1>
  <p>睡眠・活動・疲労度を記録して、関係を見える化</p>
</header>

<main>

  <div class="install-banner" id="installBanner">
    <span>ホーム画面に追加してアプリのように使えます</span>
    <button id="installBtn">追加</button>
  </div>

  <!-- ============ 記録タブ ============ -->
  <section class="tab-panel active" id="tab-record">
    <form id="entryForm">

      <div class="card">
        <h2>📅 日付</h2>
        <div class="field">
          <input type="date" id="f-date" required />
        </div>
      </div>

      <div class="card">
        <h2>😴 睡眠</h2>
        <div class="row2">
          <div class="field">
            <label>就寝時刻</label>
            <input type="time" id="f-bedtime" />
          </div>
          <div class="field">
            <label>起床時刻</label>
            <input type="time" id="f-waketime" />
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>睡眠時間(自動計算・手修正可)</label>
          <input type="number" id="f-sleephours" step="0.1" min="0" max="24" placeholder="例: 7.0" />
        </div>
      </div>

      <div class="card">
        <h2>🔋 疲労度・体調</h2>
        <div class="field">
          <label>疲労度(1=全くない 〜 5=非常に疲れている)</label>
          <div class="scale" data-target="f-fatigue">
            <button type="button" data-val="1">1</button>
            <button type="button" data-val="2">2</button>
            <button type="button" data-val="3">3</button>
            <button type="button" data-val="4">4</button>
            <button type="button" data-val="5">5</button>
          </div>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>体調(1=悪い 〜 5=良い)</label>
          <div class="scale" data-target="f-condition">
            <button type="button" data-val="1">1</button>
            <button type="button" data-val="2">2</button>
            <button type="button" data-val="3">3</button>
            <button type="button" data-val="4">4</button>
            <button type="button" data-val="5">5</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>💊 睡眠薬</h2>
        <div class="field">
          <label>内服したか</label>
          <div class="scale" data-target="f-medtaken">
            <button type="button" data-val="0">いいえ</button>
            <button type="button" data-val="1">はい</button>
          </div>
        </div>
        <div class="field" id="medNameField" style="margin-bottom:0; display:none;">
          <label>薬剤名</label>
          <input type="text" id="f-medname" list="medNameOptions" placeholder="例: マイスリー" />
          <datalist id="medNameOptions">
            <option value="マイスリー"></option>
            <option value="ルネスタ"></option>
            <option value="ロゼレム"></option>
            <option value="ベルソムラ"></option>
            <option value="デエビゴ"></option>
            <option value="レンドルミン"></option>
            <option value="ハルシオン"></option>
          </datalist>
        </div>
      </div>

      <div class="card star-card">
        <h2>☆</h2>
        <button type="button" class="star-toggle" id="starToggle" data-active="false">☆</button>
      </div>

      <div class="card">
        <h2>🏃 日中の活動</h2>
        <div id="activityList"></div>
        <button type="button" class="add-activity-btn" id="addActivityBtn">+ 活動を追加</button>
      </div>

      <div class="card">
        <h2>☕ カフェイン・アルコール</h2>
        <div class="row2">
          <div class="field">
            <label>カフェイン(杯)</label>
            <input type="number" id="f-caffeine" min="0" step="1" placeholder="0" />
          </div>
          <div class="field">
            <label>アルコール(杯)</label>
            <input type="number" id="f-alcohol" min="0" step="1" placeholder="0" />
          </div>
        </div>
      </div>

      <div class="card">
        <h2>📝 メモ</h2>
        <div class="field" style="margin-bottom:0;">
          <textarea id="f-memo" placeholder="気づいたことがあれば"></textarea>
        </div>
      </div>

      <button type="submit" class="btn" id="saveBtn">この日の記録を保存</button>
    </form>
  </section>

  <!-- ============ 履歴タブ ============ -->
  <section class="tab-panel" id="tab-history">
    <div class="card">
      <h2>💾 バックアップ</h2>
      <p style="font-size:12px;color:var(--text-dim);margin:0 0 10px;">
        データは端末内(ブラウザ)にのみ保存されます。機種変更やブラウザデータ消去に備えて、定期的にエクスポートしておくことをおすすめします。
      </p>
      <div class="row2">
        <button type="button" class="btn secondary" id="exportBtn">📤 エクスポート</button>
        <button type="button" class="btn secondary" id="importBtn">📥 インポート</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;" />
    </div>
    <div class="card">
      <h2>📖 記録履歴</h2>
      <div id="historyList"></div>
    </div>
  </section>

  <!-- ============ 分析タブ ============ -->
  <section class="tab-panel" id="tab-analysis">

    <div class="card">
      <h2>📊 概要</h2>
      <div class="stat-grid" id="statGrid"></div>
    </div>

    <div class="card">
      <h2>📈 時系列(睡眠時間・疲労度)</h2>
      <div class="chart-wrap" id="timeSeriesChart"></div>
      <div class="legend">
        <span><span class="dot" style="background:#4fb3a9;"></span>睡眠時間(h)</span>
        <span><span class="dot" style="background:#f2b155;"></span>疲労度(1-5)</span>
      </div>
    </div>

    <div class="card">
      <h2>🔗 相関分析</h2>
      <div class="select-tabs" id="corrTabs">
        <button data-pair="sleep_fatigue" class="active">睡眠時間 × 疲労度</button>
        <button data-pair="activity_fatigue">活動時間 × 疲労度</button>
        <button data-pair="caffeine_sleep">カフェイン × 睡眠時間</button>
        <button data-pair="alcohol_sleep">アルコール × 睡眠時間</button>
        <button data-pair="caffeine_fatigue_next">前日カフェイン × 翌日疲労度</button>
        <button data-pair="alcohol_fatigue_next">前日アルコール × 翌日疲労度</button>
        <button data-pair="med_sleep">睡眠薬 × 睡眠時間</button>
        <button data-pair="star_fatigue">☆ × 疲労度</button>
        <button data-pair="star_fatigue_next">前日☆ × 翌日疲労度</button>
      </div>
      <div class="chart-wrap" id="scatterChart"></div>
      <div class="corr-result">
        <div>
          <div class="corr-label" id="corrPairLabel">-</div>
          <div class="corr-value" id="corrValue">-</div>
        </div>
        <div class="corr-tag" id="corrTag">-</div>
      </div>
    </div>

  </section>

</main>

<nav class="tabbar">
  <button class="nav-btn active" data-tab="tab-record"><span class="ic">✏️</span>記録</button>
  <button class="nav-btn" data-tab="tab-history"><span class="ic">📖</span>履歴</button>
  <button class="nav-btn" data-tab="tab-analysis"><span class="ic">📊</span>分析</button>
</nav>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
